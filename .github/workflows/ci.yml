name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # website is typechecked/built by Vercel on deploy; CI covers the library and apps
      - run: pnpm --filter '!website' typecheck
      - run: pnpm --filter '!website' test
      - run: pnpm --filter react-native-a2ui build
